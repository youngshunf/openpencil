# design（OpenPencil）设计引擎打包+发布配置模板（package-design-engine.sh）
#
# 用法：复制本文件为同目录 config.yaml（生产，默认）或 config-dev.yaml（本地/测试），填好下面几项后：
#   scripts/package-design-engine.sh          # 默认读 config.yaml（生产）
#   scripts/package-design-engine.sh --dev    # 读 config-dev.yaml（本地/测试环境）
#
# 格式：YAML 扁平 key: value，# 注释，安全逐行解析（脚本不 source、不引 YAML 库，不会执行里面命令）。
# 优先级：命令行参数 > 环境变量 > 本配置文件 > 内置默认。
# ⚠ config.yaml / config-dev.yaml 均已 .gitignore（含 admin_token 敏感），只有本 .example 进版本库。
#
# 注意：design 引擎包内置原生 bun 运行时 → 包平台特定，每台构建机只产「本机 os-arch」一份。
# 跨架构须在对应架构机器上各跑一次，云端按 os-arch 累积进同一 manifest。

# 引擎版本。留空则读 openpencil package.json 的 version。
version: 0.5.0

# 云端 API 基址（给了即开启发布）。生产：https://api.huanxing.dcfuture.cn；本地 dev：http://127.0.0.1:8020
publish_url: https://api.huanxing.dcfuture.cn

# 云端 design 应用目录行 ID（hasn_app_catalog 里 app_id='design' 那行主键；生产/本地可能不同）
app_pk: 0

# 管理端 JWT。⚠ 敏感：复制后的 config.yaml 已 .gitignore，可直接填真实 token；
# 亦可留空、改用环境变量注入：HASN_ADMIN_TOKEN=<jwt> scripts/package-design-engine.sh（环境变量覆盖本文件）。
admin_token: ""

# 以下可选（一般用默认即可）：
# os_arch: darwin-aarch64              # 覆盖 os-arch 标识，留空按 host 探测
# bun_version: 1.3.8                   # 内置 bun 运行时版本，留空用脚本内置默认
# src: /abs/path/to/openpencil         # OpenPencil 收编根，默认=引擎仓根
# out: /abs/path/to/out                # 默认=<引擎仓根>/.engine-build/design-engine
# base_url: https://cdn.example/design # 仅手工上传场景；--publish 时云端公共桶自动分配 URL
